# Weekly dependency updates (free for public repositories). Security updates arrive as soon as
# GitHub publishes an advisory, independent of this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # one pull request a week per ecosystem, not one per package
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # major versions (Next, Tailwind, ESLint, TypeScript, ...) are migrations: done by hand, one at a time
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
