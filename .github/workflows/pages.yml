name: Pages (static demo)

# Builds the read-only demo: the synthetic data pack + every sample run through the API,
# exported as static JSON, and the frontend built in static-export mode. No backend at runtime.
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///./data/airbrief.db
      DATA_DIR: ./data
      UPLOAD_DIR: ./data/uploads
      DATAPACK_DIR: ./data/datapacks
      DEFAULT_DATAPACK: demo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]" -c requirements/constraints.txt

      - name: Seed the synthetic data pack
        run: |
          mkdir -p data
          python -m seed.datapack --synthetic --name demo

      - name: Export demo JSON
        run: python -m seed.demo_export --out frontend/public/demo

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_DEMO: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run build
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only the job that publishes gets to write to Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
