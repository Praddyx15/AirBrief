name: CI

on:
  # other branches are checked by their pull request, so a Dependabot branch runs once, not twice
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # Core + API: lint, types, tests (SQLite and PostgreSQL 16)
  python:
    name: python ${{ matrix.python }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        db: [sqlite, postgres]
    services:
      postgres:
        # An empty image means the service is not started (sqlite legs).
        image: ${{ matrix.db == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: airbrief
          POSTGRES_PASSWORD: airbrief
          POSTGRES_DB: airbrief
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airbrief -d airbrief"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: development
      DATA_DIR: ./data
      UPLOAD_DIR: ./data/uploads
      DATAPACK_DIR: ./data/datapacks
      AUTO_MIGRATE: "true"
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://airbrief:airbrief@localhost:5432/airbrief' || 'sqlite:///./data/airbrief.db' }}
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://airbrief:airbrief@localhost:5432/airbrief' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt

      - name: Install (core + api + dev)
        if: matrix.db == 'sqlite'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]" ${{ matrix.python == '3.12' && '-c requirements/constraints.txt' || '' }}

      - name: Install (core + api + dev + postgres)
        if: matrix.db == 'postgres'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev,postgres]" ${{ matrix.python == '3.12' && '-c requirements/constraints.txt' || '' }}

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy airbrief_core api seed

      - name: Migrations apply cleanly
        run: |
          mkdir -p data
          alembic upgrade head

      - name: pytest
        run: >-
          pytest -m "not native and not network"
          --cov=airbrief_core --cov=api
          --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python }}-${{ matrix.db }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # Optional C++ kernel: build + parity tests against the Python fallback
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            native/pyproject.toml
            requirements/constraints.txt

      - name: Install core and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]" -c requirements/constraints.txt

      - name: Build and install the native kernel
        run: pip install ./native

      - name: Confirm the C++ backend is active
        run: python -c "import airbrief_core._native as n; print(n.BACKEND); assert n.BACKEND == 'cpp'"

      - name: Parity tests
        run: pytest -m native

  # Protobuf contracts (buf STANDARD lint)
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true

      - name: buf lint
        working-directory: contracts/proto
        run: buf lint

      - name: buf build
        working-directory: contracts/proto
        run: buf build -o /dev/null

  # Security: known-vulnerable dependencies and medium or high bandit findings fail the build
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt

      - name: Audit Python dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]" pip-audit -c requirements/constraints.txt
          pip-audit --skip-editable

      - name: Static analysis (bandit, medium and high)
        run: |
          pip install bandit==1.9.4
          bandit -r airbrief_core api seed -ll -ii

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Audit npm production dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate

  # Secret scan: a secret in any commit fails the build (gitleaks CLI, MIT; the download is
  # checked against the SHA-256 in that release's checksums file)
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan every commit
        run: $RUNNER_TEMP/gitleaks git --redact --verbose --no-banner .

  # Frontend: lint, type check, production build
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # End to end: real API (SQLite + synthetic data pack) + production web build + Playwright/axe
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/airbrief.db
      DATA_DIR: ./data
      UPLOAD_DIR: ./data/uploads
      DATAPACK_DIR: ./data/datapacks
      DEFAULT_DATAPACK: demo
      AUTO_MIGRATE: "true"
      JOB_MODE: inprocess
      RATE_LIMIT_PER_HOUR: "0"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]" -c requirements/constraints.txt

      - name: Build synthetic data pack and samples
        run: |
          mkdir -p data
          python -m seed.datapack --synthetic --name demo
          python -m seed.samples --dest samples/

      - name: Start API in the background
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo "API started (pid $!)"

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build and start the web app in the background
        working-directory: frontend
        run: |
          npm run build
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > ../web.log 2>&1 &
          echo "Web started (pid $!)"

      - name: Wait for API health and web
        run: |
          for i in $(seq 120); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/health && curl -fsS -o /dev/null http://127.0.0.1:3000 && exit 0
            sleep 1
          done
          echo "API or web did not come up within 120 s" && exit 1

      - name: Show health
        run: curl -fsS http://127.0.0.1:8000/health

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            api.log
            web.log
          if-no-files-found: ignore
          retention-days: 14
